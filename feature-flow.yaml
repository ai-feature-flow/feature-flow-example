# The repository manifest (Feature Flow docs/07 section 4), read by the engine at each step.
api_version: feature-flow/v1
kind: repository

# The SDK the repository needs. The engine does not build its sandbox from this yet, and the
# current sandbox image has no .NET SDK, so both tiers run in CI and there are no setup commands.
environment:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  os: linux
  docker: false

test_tiers:
  - name: unit
    tags: [unit]
    command: dotnet test tests/FeatureFlow.Example.Api.UnitTests --filter Category=unit --logger trx --results-directory artifacts
    result: { format: trx, path: "artifacts/*.trx" }
    targets: [ci]
    ci: { job: unit.yml }

  - name: integration
    tags: [integration]
    command: docker compose -f compose.integration.yaml up --abort-on-container-exit --exit-code-from integration-tests
    targets: [ci]
    ci: { job: integration.yml }

static_analysis:
  analyser: none
